<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>CB Local Radio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <main
        id="radio"
        class="hidden"
        aria-hidden="true"
    >
        <section
            class="device"
            role="dialog"
            aria-label="CB Local Radio"
        >

            <div class="device-frame">

                <header class="top">

                    <div class="brand-block">

                        <div class="brand">
                            <span class="brand-mark">CB</span>

                            <span
                                class="brand-name"
                                data-i18n="brand"
                            >
                                LOCAL RADIO
                            </span>
                        </div>

                        <div
                            class="device-subtitle"
                            data-i18n="subtitle"
                        >
                            SURVIVAL COMMUNICATION UNIT
                        </div>

                    </div>

                    <div class="top-status">

                        <span
                            class="power-label"
                            data-i18n="power"
                        >
                            PWR
                        </span>

                        <span class="power-led"></span>

                        <button
                            id="close"
                            class="close-button"
                            type="button"
                            data-i18n-aria="close_radio"
                            aria-label="Close radio"
                        >
                            ×
                        </button>

                    </div>

                </header>

                <div class="header-rule"></div>

                <section class="screen">

                    <div class="screen-grid"></div>
                    <div class="screen-scanline"></div>

                    <div class="screen-topline">

                        <div class="status">

                            <span
                                id="led"
                                class="signal-led"
                            ></span>

                            <span class="status-copy">

                                <span
                                    class="status-label"
                                    data-i18n="signal"
                                >
                                    SIGNAL
                                </span>

                                <span
                                    id="signalText"
                                    data-i18n="signal_none"
                                >
                                    NO SIGNAL
                                </span>

                            </span>

                        </div>

                        <div
                            class="screen-mode"
                            data-i18n="local_mode"
                        >
                            LOCAL
                        </div>

                    </div>

                    <div class="frequency-block">

                        <div
                            class="frequency-caption"
                            data-i18n="active_frequency"
                        >
                            ACTIVE FREQUENCY
                        </div>

                        <div class="frequency-row">

                            <span class="frequency-prefix">
                                CH
                            </span>

                            <div id="frequency">
                                000.0
                            </div>

                            <span class="frequency-unit">
                                MHz
                            </span>

                        </div>

                    </div>

                    <div class="screen-divider"></div>

                    <div class="network">

                        <div class="network-label">

                            <span class="network-dot"></span>

                            <span data-i18n="network">
                                NETWORK
                            </span>

                        </div>

                        <strong
                            id="networkState"
                            data-i18n="disconnected"
                        >
                            DISCONNECTED
                        </strong>

                    </div>

                    <div class="screen-footer">

                        <span data-i18n="cb_surv">
                            CB-SURV
                        </span>

                        <span data-i18n="field_radio">
                            FIELD RADIO
                        </span>

                        <span>
                            01
                        </span>

                    </div>

                </section>

                <section class="controls">

                    <button
                        id="down"
                        class="frequency-button"
                        type="button"
                        data-i18n-aria="decrease_frequency"
                        aria-label="Decrease frequency"
                    >
                        <span class="button-symbol">
                            −
                        </span>

                        <span
                            class="button-caption"
                            data-i18n="down"
                        >
                            DOWN
                        </span>
                    </button>

                    <button
                        id="channel"
                        class="frequency-display-button"
                        type="button"
                        data-i18n-aria="set_frequency"
                        aria-label="Set frequency"
                    >
                        <span
                            class="control-label"
                            data-i18n="frequency"
                        >
                            FREQUENCY
                        </span>

                        <span
                            class="control-hint"
                            data-i18n="select_channel"
                        >
                            SELECT CHANNEL
                        </span>
                    </button>

                    <button
                        id="up"
                        class="frequency-button"
                        type="button"
                        data-i18n-aria="increase_frequency"
                        aria-label="Increase frequency"
                    >
                        <span class="button-symbol">
                            +
                        </span>

                        <span
                            class="button-caption"
                            data-i18n="up"
                        >
                            UP
                        </span>
                    </button>

                </section>

                <section class="volume-panel">

                    <div class="section-heading">

                        <div>

                            <span
                                class="section-kicker"
                                data-i18n="audio_control"
                            >
                                AUDIO CONTROL
                            </span>

                            <span
                                class="section-title"
                                data-i18n="volume"
                            >
                                VOLUME
                            </span>

                        </div>

                        <strong id="volumeValue">
                            50%
                        </strong>

                    </div>

                    <div class="volume-track-wrapper">

                        <span
                            class="volume-mark"
                            data-i18n="min"
                        >
                            MIN
                        </span>

                        <input
                            id="volume"
                            type="range"
                            min="0"
                            max="100"
                            value="50"
                            data-i18n-aria="volume_label"
                            aria-label="Volume"
                        >

                        <span
                            class="volume-mark"
                            data-i18n="max"
                        >
                            MAX
                        </span>

                    </div>

                    <div
                        class="volume-scale"
                        aria-hidden="true"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </section>

                <section class="actions">

                    <button
                        id="join"
                        class="action-button connect"
                        type="button"
                    >
                        <span class="action-indicator"></span>

                        <span class="action-copy">

                            <strong data-i18n="connect">
                                CONNECT
                            </strong>

                            <small data-i18n="join_frequency">
                                JOIN FREQUENCY
                            </small>

                        </span>

                    </button>

                    <button
                        id="leave"
                        class="action-button danger"
                        type="button"
                    >
                        <span class="action-indicator"></span>

                        <span class="action-copy">

                            <strong data-i18n="disconnect">
                                DISCONNECT
                            </strong>

                            <small data-i18n="leave_network">
                                LEAVE NETWORK
                            </small>

                        </span>

                    </button>

                </section>

                <footer class="hint">

                    <span>ESC</span>

                    <span data-i18n="close">
                        CLOSE
                    </span>

                    <i></i>

                    <span>↑ ↓</span>

                    <span data-i18n="change_frequency">
                        CHANGE FREQUENCY
                    </span>

                    <i></i>

                    <span>WHEEL</span>

                    <span data-i18n="tune">
                        TUNE
                    </span>

                </footer>

            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
